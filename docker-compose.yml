version: "3"
services:
  directus:
    image: directus/directus:10.10.0
    ports:
      - "8055:8055"
    volumes:
      - ./directus/database:/directus/database
      - ./directus/uploads:/directus/uploads
    environment:
      KEY: "REMOVED_DIRECTUS_KEY"
      SECRET: "REMOVED_DIRECTUS_SECRET"
      ADMIN_EMAIL: "admin@spead.ai"
      ADMIN_PASSWORD: "REMOVED_DIRECTUS_ADMIN_PASSWORD"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
